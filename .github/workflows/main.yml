name: Build AppImage

run-name: ${{ github.actor }} is testing out building appimage
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4

    - name: List workspace
      working-directory: ${{github.workspace}}
      run : ls

    - name: Install PyQt6
      working-directory: ${{github.workspace}}
      run : python3 -m pip install --prefix=/usr --root=AppDir PyQt6

    - name: Install hid
      working-directory: ${{github.workspace}}
      run : python3 -m pip install --prefix=/usr --root=AppDir hid

    - name: Build AppImage
      uses: AppImageCrafters/build-appimage-action@master
      with:
        recipe: build-scripts/AppImageBuilder.yml     
    
    - uses: actions/upload-artifact@v4
      with:
        name: KeychronWidget
        path: './*.AppImage*'
    
    - uses: xresloader/upload-to-github-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.LAUT_UPLOAD_TOKEN }}
      with:
        file: './*.AppImage*'
        tags: true
        draft: true
